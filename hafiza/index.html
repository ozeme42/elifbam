<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🃏 Hafıza & Kart Eşleştirme - Elifba</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <script src="confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdf4ff 0%, #ede9fe 50%, #e0e7ff 100%);
            --card-front: #ffffff;
            --card-back: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #1e1b4b;
            user-select: none;
        }

        /* Üst Menü */
        .top-nav {
            max-width: 900px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .home-btn {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 8px 18px;
            font-size: 15px;
            font-weight: 700;
            color: #334155;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .home-btn:hover { background: #f8fafc; transform: translateY(-2px); }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #4338ca;
            margin: 0;
            font-size: 2.2rem;
            text-align: center;
            text-shadow: 1px 1px 0 #fff;
        }

        /* Skor ve Sayaç Barı */
        .stats-bar {
            background: white;
            padding: 12px 24px;
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.1);
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
            border: 2px solid #e0e7ff;
            max-width: 600px;
            width: 100%;
        }

        .stat-item {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-item strong { color: #4f46e5; font-size: 1.15rem; }

        /* Bölüm ve Zorluk Seçimi */
        .control-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .pill-btn {
            background: white;
            border: 1.5px solid #c7d2fe;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #4338ca;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill-btn:hover { background: #e0e7ff; }
        .pill-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #3730a3;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        /* Kart Tablası Grid */
        .memory-grid {
            display: grid;
            gap: 15px;
            max-width: 750px;
            width: 100%;
            perspective: 1000px;
            margin: 0 auto 30px;
            justify-content: center;
        }
        .grid-8 {
            grid-template-columns: repeat(4, 1fr);
        }
        .grid-12 {
            grid-template-columns: repeat(4, 1fr);
        }

        /* Hafıza Kartı */
        .card-wrapper {
            aspect-ratio: 1 / 1.15;
            min-width: 90px;
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 20px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }

        .card-wrapper.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid white;
        }

        /* Kartın Arkası (Kapalı Hali) */
        .card-back {
            background: var(--card-back);
            color: white;
            font-size: 2.2rem;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.3);
        }
        .card-back::after {
            content: '⭐';
            font-size: 2rem;
            opacity: 0.8;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* Kartın Önü (Açık Hali) */
        .card-front {
            background: var(--card-front);
            transform: rotateY(180deg);
            padding: 12px;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.1));
        }

        /* Eşleşen Kartlar */
        .card-wrapper.matched .card-inner {
            animation: matchPulse 0.6s ease forwards;
        }
        .card-wrapper.matched .card-front {
            border-color: #f59e0b;
            background: #fffbeb;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.12); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* Uyuşmayan Yanlış Kartlar */
        .card-wrapper.shake .card-inner {
            animation: shakeCard 0.4s ease;
        }
        @keyframes shakeCard {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            20%, 60% { transform: rotateY(180deg) translateX(-8px); }
            40%, 80% { transform: rotateY(180deg) translateX(8px); }
        }

        /* Sevimli Maskot "Hüdhüd" */
        .mascot-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid #e0e7ff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            margin-top: 10px;
            max-width: 500px;
            width: 100%;
        }

        .mascot-avatar {
            width: 55px;
            height: 55px;
            cursor: pointer;
            transition: transform 0.2s;
            animation: mascotBounce 2s infinite alternate;
        }
        @keyframes mascotBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        .mascot-text {
            font-weight: 700;
            color: #3730a3;
            font-size: 0.95rem;
        }

        /* Bitiş / Tebrikler Modalı */
        .win-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .win-content {
            background: white;
            padding: 30px;
            border-radius: 28px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            border: 4px solid #facc15;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popUp { from { transform: scale(0.7); } to { transform: scale(1); } }

        .win-trophy { font-size: 4rem; margin-bottom: 10px; animation: trophyWiggle 0.8s infinite alternate; }
        @keyframes trophyWiggle { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

        .win-btn {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            margin: 6px;
            transition: all 0.2s;
        }
        .win-btn:hover { transform: translateY(-2px); }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .grid-8, .grid-12 { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .card-wrapper { min-width: 80px; }
        }
    </style>
</head>

        let timerInterval = null;

        let totalStars = parseInt(localStorage.getItem('elifbam_total_stars') || '0', 10);

        const gridEl = document.getElementById('memory-grid');
        const cardAudio = document.getElementById('card-audio');

        window.addEventListener('DOMContentLoaded', () => {
            buildSectionPills();
            updateStarsUI();
            restartGame();
        });

        function buildSectionPills() {
            const container = document.getElementById('section-pills');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'pill-btn' + (currentSectionId === 'all' ? ' active' : '');
            allBtn.textContent = '⭐ Tüm Harfler';
            allBtn.onclick = () => selectSection('all');
            container.appendChild(allBtn);

            sections.forEach(sec => {
                const b = document.createElement('button');
                b.className = 'pill-btn' + (currentSectionId === sec.id ? ' active' : '');
                b.textContent = `${sec.name} (${sec.label})`;
                b.onclick = () => selectSection(sec.id);
                container.appendChild(b);
            });
        }

        function selectSection(secId) {
            currentSectionId = secId;
            document.querySelectorAll('#section-pills .pill-btn').forEach(b => b.classList.remove('active'));
            if (secId === 'all') {
                document.querySelector('#section-pills .pill-btn:first-child').classList.add('active');
            } else {
                const sec = sections.find(s => s.id === secId);
                const btn = Array.from(document.querySelectorAll('#section-pills .pill-btn')).find(b => b.textContent.includes(sec.name));
                if (btn) btn.classList.add('active');
            }
            restartGame();
        }

        function setGridSize(size) {
            gridSize = size;
            document.getElementById('btn-mode-8').classList.toggle('active', size === 8);
            document.getElementById('btn-mode-12').classList.toggle('active', size === 12);
            gridEl.className = `memory-grid ${size === 8 ? 'grid-8' : 'grid-12'}`;
            restartGame();
        }

        function restartGame() {
            document.getElementById('win-modal').style.display = 'none';
            if (timerInterval) clearInterval(timerInterval);
            timerSeconds = 0;
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isLockGrid = false;
            updateStats();

            // Havuzdan kart çiftlerini seç
            let pool = [];
            if (currentSectionId === 'all') {
                pool = lettersData.map(l => l.id);
            } else {
                const sec = sections.find(s => s.id === currentSectionId);
                pool = [...sec.items];
            }

            // Gerekli çift sayısı: gridSize / 2
            const numPairs = gridSize / 2;
            let chosen = shuffleArray([...pool]).slice(0, numPairs);
            while (chosen.length < numPairs) {
                const extra = pool[Math.floor(Math.random() * pool.length)];
                chosen.push(extra);
            }

            // Her harften 2 adet kart oluştur
            let cardDeck = [];
            chosen.forEach((letterId, idx) => {
                cardDeck.push({ uid: `${idx}-A`, letterId: letterId });
                cardDeck.push({ uid: `${idx}-B`, letterId: letterId });
            });

            cardDeck = shuffleArray(cardDeck);
            renderCards(cardDeck);

            timerInterval = setInterval(() => {
                timerSeconds++;
                updateStats();
            }, 1000);

            setMascotMessage("Kartları çevirerek aynı harfleri eşleştirelim! 🎯");
        }

        function renderCards(deck) {
            gridEl.innerHTML = '';
            deck.forEach(cardItem => {
                const wrap = document.createElement('div');
                wrap.className = 'card-wrapper';
                wrap.dataset.letterId = cardItem.letterId;
                wrap.dataset.uid = cardItem.uid;

                wrap.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <img src="../harfler/harfler/${cardItem.letterId}.png" alt="Harf">
                        </div>
                    </div>
                `;

                wrap.onclick = () => onCardClick(wrap, cardItem.letterId);
                gridEl.appendChild(wrap);
            });
        }

        function onCardClick(cardEl, letterId) {
            if (isLockGrid) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            // Kartı çevir ve sesini dinlet
            cardEl.classList.add('flipped');
            playLetterSound(letterId);
            playFlipSound();
            flippedCards.push(cardEl);

            if (flippedCards.length === 2) {
                moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            isLockGrid = true;
            const [c1, c2] = flippedCards;
            const l1 = c1.dataset.letterId;
            const l2 = c2.dataset.letterId;

            if (l1 === l2) {
                // EŞLEŞME BAŞARILI!
                setTimeout(() => {
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    playMatchSound();
                    matchedPairs++;
                    totalStars += 1;
                    localStorage.setItem('elifbam_total_stars', totalStars);
                    updateStarsUI();

                    const letterInfo = lettersData.find(l => l.id == l1);
                    const name = letterInfo ? letterInfo.name : "";
                    setMascotMessage(`🎉 Harika! ${name} harfini eşleştirdin!`);

                    flippedCards = [];
                    isLockGrid = false;

                    // Oyun Bitti mi?
                    if (matchedPairs === gridSize / 2) {
                        onGameWon();
                    }
                }, 400);
            } else {
                // EŞLEŞMEDİ
                setTimeout(() => {
                    c1.classList.add('shake');
                    c2.classList.add('shake');
                    playBoopSound();
                }, 350);

                setTimeout(() => {
                    c1.classList.remove('flipped', 'shake');
                    c2.classList.remove('flipped', 'shake');
                    flippedCards = [];
                    isLockGrid = false;
                }, 950);
            }
        }

        function onGameWon() {
            clearInterval(timerInterval);
            totalStars += 5; // Bonus galibiyet yıldızları
            localStorage.setItem('elifbam_total_stars', totalStars);
            updateStarsUI();

            playFanfareSound();
            if (typeof confetti === 'function') {
                confetti({ particleCount: 75, spread: 70, origin: { y: 0.5 } });
            }

            document.getElementById('win-moves').textContent = moves;
            document.getElementById('win-time').textContent = formatTime(timerSeconds);
            document.getElementById('win-modal').style.display = 'flex';
        }

        function updateStats() {
            document.getElementById('val-moves').textContent = moves;
            document.getElementById('val-timer').textContent = formatTime(timerSeconds);
        }

        function updateStarsUI() {
            document.getElementById('val-stars').textContent = totalStars;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function playLetterSound(id) {
            cardAudio.src = `../harfler/harfler/${id}.mp3`;
            cardAudio.play().catch(() => {});
        }

        function setMascotMessage(msg) {
            document.getElementById('mascot-text').textContent = msg;
        }

        function onMascotClick() {
            playMatchSound();
            const quotes = [
                "Hafızan çok güçlü maşallah!",
                "Kartların yerini aklında tutmaya çalış!",
                "Harika gidiyorsun, devam et!",
                "Eşleştirdikçe yıldızların çoğalıyor! ⭐"
            ];
            setMascotMessage(quotes[Math.floor(Math.random() * quotes.length)]);
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Web Audio Ses Efektleri
        function playFlipSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.09);
            } catch(e) {}
        }

        function playMatchSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                [523.25, 659.25, 783.99].forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.08);
                    osc.stop(ctx.currentTime + i * 0.08 + 0.26);
                });
            } catch(e) {}
        }

        function playBoopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.19);
            } catch(e) {}
        }

        function playFanfareSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.1);
                    osc.stop(ctx.currentTime + i * 0.1 + 0.36);
                });
            } catch(e) {}
        }
    </script>
</body>
